<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║       🍄 버섯 병해 AI 진단 시스템 v2                          ║
  ║   드래그&드롭 + 병해 원인/처리 정보 카드 추가 버전             ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 스마트폰 화면에 맞게 자동 조절 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍄 버섯 병해 AI 진단기</title>

  <!-- AI 모델 실행에 필요한 외부 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    /* ════════════════════════════════════════════
       🎨 색상 테마 변수 – 여기서 전체 색상을 관리
       ════════════════════════════════════════════ */
    :root {
      --bg-dark:        #0a1628;
      --bg-card:        #111e35;
      --accent-green:   #4ade80;
      --accent-yellow:  #fbbf24;
      --accent-red:     #f87171;
      --accent-orange:  #fb923c;
      --accent-blue:    #60a5fa;
      --accent-purple:  #c084fc;
      --text-main:      #e2e8f0;
      --text-sub:       #94a3b8;
      --border:         #1e3a5f;
      --shadow:         rgba(0,0,0,0.5);
    }

    /* 브라우저 기본 여백 제거 */
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(74,222,128,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(96,165,250,0.04) 0%, transparent 50%);
      font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 앱 전체 너비 제한 – PC에서도 모바일처럼 보임 */
    .app-wrapper {
      width: 100%;
      max-width: 480px;
      padding: 0 16px 60px;
    }

    /* ── 상단 헤더 ────────────────────────────── */
    .header {
      text-align: center;
      padding: 36px 0 24px;
    }
    .header-badge {
      display: inline-block;
      background: rgba(74,222,128,0.12);
      border: 1px solid rgba(74,222,128,0.3);
      color: var(--accent-green);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }
    .header h1 span { color: var(--accent-green); }
    .header p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 8px;
      line-height: 1.6;
    }

    /* ── 카드 공통 ────────────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 24px var(--shadow);
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ════════════════════════════════════════════
       ① 드래그&드롭 업로드 영역
       ════════════════════════════════════════════ */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      background: rgba(255,255,255,0.02);
      position: relative;
      /* 드래그 중에 자식 요소가 이벤트를 가로채지 않도록 설정
         (이것이 없으면 드래그가 끊기는 버그가 생깁니다) */
      user-select: none;
    }
    .upload-zone:hover {
      border-color: var(--accent-green);
      background: rgba(74,222,128,0.05);
    }
    /* 파일을 드래그해서 이 영역 위에 올렸을 때 강조 효과
       JavaScript에서 'drag-over' 클래스를 붙여줍니다 */
    .upload-zone.drag-over {
      border-color: var(--accent-green);
      border-style: solid;            /* 점선 → 실선으로 변경 */
      background: rgba(74,222,128,0.1);
      transform: scale(1.01);         /* 약간 확대 효과 */
      box-shadow: 0 0 20px rgba(74,222,128,0.2);
    }

    /* 업로드 아이콘 – 위아래로 둥실둥실 움직임 */
    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
      animation: float 3s ease-in-out infinite;
      /* 드래그 중에는 아이콘이 마우스 이벤트를 막지 않도록 */
      pointer-events: none;
    }
    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-8px); }
    }
    .upload-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      pointer-events: none;
    }
    .upload-subtext {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.7;
      pointer-events: none;
    }
    /* 드래그 안내 뱃지 */
    .drag-hint {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      background: rgba(74,222,128,0.08);
      border: 1px solid rgba(74,222,128,0.2);
      color: var(--accent-green);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      pointer-events: none;
    }

    /* ── 카메라 / 갤러리 버튼 ──────────────────── */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .btn {
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }

    .btn-camera {
      background: linear-gradient(135deg,#1a3a2a,#1e4a30);
      color: var(--accent-green);
      border: 1px solid rgba(74,222,128,0.3);
    }
    .btn-camera:hover {
      background: linear-gradient(135deg,#1e4a30,#22593a);
      border-color: rgba(74,222,128,0.6);
    }
    .btn-gallery {
      background: linear-gradient(135deg,#1a2a3a,#1e3050);
      color: var(--accent-blue);
      border: 1px solid rgba(96,165,250,0.3);
    }
    .btn-gallery:hover {
      background: linear-gradient(135deg,#1e3050,#22405a);
      border-color: rgba(96,165,250,0.6);
    }

    /* 실제 파일 입력 요소 – 화면에서 숨김 */
    #fileInput { display: none; }

    /* ── 이미지 미리보기 ──────────────────────── */
    .preview-wrap {
      display: none;
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      position: relative;
      background: #000;
    }
    #previewImg {
      width: 100%;
      display: block;
      max-height: 320px;
      object-fit: contain;
    }
    .preview-badge {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0,0,0,0.7);
      color: var(--accent-green);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(74,222,128,0.4);
    }

    /* ── 분석 시작 버튼 ────────────────────────── */
    .btn-analyze {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg,#16a34a,#22c55e);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 16px;
      display: none;          /* 사진 올리기 전에는 숨김 */
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(34,197,94,0.3);
      font-family: inherit;
    }
    .btn-analyze:hover {
      background: linear-gradient(135deg,#15803d,#16a34a);
      box-shadow: 0 0 30px rgba(34,197,94,0.5);
      transform: translateY(-1px);
    }
    .btn-analyze:active { transform: translateY(0) scale(0.99); }

    /* ── 로딩 스피너 ────────────────────────────── */
    .loading-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
    }
    .spinner {
      width: 50px; height: 50px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent-green);
      border-right-color: rgba(74,222,128,0.3);
      animation: spin 0.8s linear infinite;
      position: relative;
    }
    .spinner::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: rgba(74,222,128,0.5);
      animation: spin 1.4s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-sub);
      text-align: center;
    }
    .loading-dots span { animation: blink 1.4s infinite; opacity: 0; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

    /* ════════════════════════════════════════════
       📊 결과 영역
       ════════════════════════════════════════════ */
    #resultSection { display: none; }

    /* 최고 신뢰도 결과 강조 박스 */
    .top-result {
      background: linear-gradient(135deg,rgba(74,222,128,0.08),rgba(74,222,128,0.02));
      border: 1px solid rgba(74,222,128,0.25);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .top-result-icon {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(74,222,128,0.12);
      border: 2px solid rgba(74,222,128,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .top-result-text { flex: 1; }
    .top-result-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .top-result-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .top-result-conf {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent-green);
      line-height: 1;
    }

    /* 게이지 바 */
    .result-item { margin-bottom: 14px; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .result-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .result-pct { font-size:15px; font-weight:800; }
    .bar-track {
      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1s cubic-bezier(0.4,0,0.2,1);
      position: relative;
    }
    .bar-fill::after {
      content:'';
      position:absolute; top:0; right:0;
      height:100%; width:30px;
      background:rgba(255,255,255,0.2);
      filter:blur(4px);
    }

    /* ════════════════════════════════════════════
       ② 병해 정보 카드 (원인 + 처리방법)
       새로 추가된 스타일입니다
       ════════════════════════════════════════════ */

    /* 병해 정보 카드 전체 래퍼 */
    .disease-card {
      border-radius: 16px;
      overflow: hidden;
      margin-top: 16px;
      border: 1px solid var(--border);
    }

    /* 카드 상단 – 병명 + 위험도 */
    .disease-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .disease-header-icon {
      font-size: 28px;
      flex-shrink: 0;
    }
    .disease-header-text { flex: 1; }
    .disease-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 3px;
    }
    /* 위험도 배지 (위험 / 주의 / 정상) */
    .severity-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .severity-high   { background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.3); }
    .severity-medium { background:rgba(251,191,36,0.15);  color:#fbbf24; border:1px solid rgba(251,191,36,0.3); }
    .severity-low    { background:rgba(74,222,128,0.15);  color:#4ade80; border:1px solid rgba(74,222,128,0.3); }

    /* 카드 본문 – 정보 섹션들 */
    .disease-body {
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 구분선 */
    .disease-divider {
      height: 1px;
      background: var(--border);
      margin: 0 -20px;
    }

    /* 각 정보 섹션 (원인 / 증상 / 처리방법) */
    .info-section {}
    .info-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-section-content {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.8;
    }

    /* 처리방법 – 번호 있는 액션 리스트 */
    .action-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 10px 12px;
      border-left: 3px solid transparent; /* 색상은 JS에서 설정 */
    }
    .action-num {
      width: 20px; height: 20px;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .action-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-main);
    }
    /* 긴급 처리항목 강조 */
    .action-item.urgent {
      background: rgba(248,113,113,0.07);
      border-left-color: #f87171;
    }
    .action-item.urgent .action-num {
      background: rgba(248,113,113,0.2);
      color: #f87171;
    }
    /* 일반 처리항목 */
    .action-item.normal {
      border-left-color: var(--accent-blue);
    }
    .action-item.normal .action-num {
      background: rgba(96,165,250,0.2);
      color: var(--accent-blue);
    }
    /* 예방 항목 */
    .action-item.prevent {
      border-left-color: var(--accent-green);
    }
    .action-item.prevent .action-num {
      background: rgba(74,222,128,0.2);
      color: var(--accent-green);
    }

    /* 정상 판정 시 초록 배너 */
    .healthy-banner {
      background: linear-gradient(135deg,rgba(74,222,128,0.1),rgba(74,222,128,0.04));
      border: 1px solid rgba(74,222,128,0.25);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin-top: 16px;
    }
    .healthy-banner .big-icon { font-size: 40px; margin-bottom: 10px; }
    .healthy-banner h3 {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-green);
      margin-bottom: 6px;
    }
    .healthy-banner p {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.7;
    }

    /* ── 주의사항 박스 ─────────────────────────── */
    .notice-box {
      background: rgba(251,191,36,0.06);
      border: 1px solid rgba(251,191,36,0.2);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 16px;
    }
    .notice-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
    .notice-text { font-size:12px; color:var(--text-sub); line-height:1.7; }

    /* ── 하단 모델 정보 ─────────────────────────── */
    .footer-info {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .info-item { display:flex; flex-direction:column; gap:3px; }
    .info-label { font-size:10px; color:var(--text-sub); font-weight:600; letter-spacing:0.8px; text-transform:uppercase; }
    .info-value { font-size:12px; color:var(--text-main); font-weight:600; }
    .info-value.green { color:var(--accent-green); }
    .info-value.blue  { color:var(--accent-blue); }
    .divider          { width:1px; background:var(--border); }

    /* ── 다시 분석 버튼 ─────────────────────────── */
    .btn-retry {
      width: 100%;
      padding: 14px;
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-retry:hover {
      border-color: var(--text-sub);
      color: var(--text-main);
      background: rgba(255,255,255,0.03);
    }

    @media (min-width:480px) {
      .app-wrapper { padding: 0 0 60px; }
    }
  </style>
</head>

<body>
<div class="app-wrapper">

  <!-- ① 헤더 -->
  <header class="header">
    <div class="header-badge">AI Diagnosis System</div>
    <h1>🍄 버섯 병해<br><span>AI 진단기</span></h1>
    <p>사진 한 장으로 버섯의 병해를<br>즉시 진단해 드립니다</p>
  </header>

  <!-- ② 업로드 카드 -->
  <div class="card">
    <div class="card-title"><span>📷</span> 사진 업로드</div>

    <!--
      드래그&드롭 + 클릭 업로드 영역
      - ondragover  : 파일을 이 영역 위로 끌어왔을 때
      - ondragleave : 파일을 이 영역 밖으로 벗어났을 때
      - ondrop      : 파일을 이 영역에 놓았을 때
      - onclick     : 클릭했을 때 파일 선택창 열기
    -->
    <div class="upload-zone" id="uploadZone"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)"
         ondrop="handleDrop(event)"
         onclick="openGallery()">
      <span class="upload-icon">🍄</span>
      <div class="upload-text">버섯 사진을 올려주세요</div>
      <div class="upload-subtext">
        아래 버튼으로 카메라 촬영 또는<br>갤러리에서 사진을 선택하세요
      </div>

  // ════════════════════════════════════════════════════

  // Teachable Machine 모델 URL (반드시 끝에 '/' 포함)

  // ════════════════════════════════════════════════════
  // 🔧 클래스 이름 정규화 함수
  //    모델이 반환하는 이름에 눈에 안 보이는 공백·특수문자가
  //    섞여 있어도 DB와 매칭되도록 전처리합니다
  // ════════════════════════════════════════════════════
  function normalizeName(name) {
    return name
      .trim()                        // 앞뒤 공백 제거
      .replace(/\s+/g, " ")          // 연속 공백 → 공백 1개
      .replace(/\u200b/g, "")        // 제로폭 공백(Zero-width space) 제거
      .replace(/\ufeff/g, "")        // BOM 문자 제거
      .normalize("NFC");             // 한글 자모 결합 정규화 (macOS 호환)
  }

  // DB 키도 미리 정규화해 두는 함수 – 매칭 시 사용
  function findInDB(className) {
    const norm = normalizeName(className);
    // 1차: 정규화 후 정확히 일치하는 키 찾기
    for (const key of Object.keys(DISEASE_DB)) {
      if (normalizeName(key) === norm) return DISEASE_DB[key];
    }
    // 2차: 정규화 후 포함 관계로 찾기 (예: "푸른곰팡이" ↔ "푸른곰팡이병")
    for (const key of Object.keys(DISEASE_DB)) {
      const normKey = normalizeName(key);
      if (norm.includes(normKey) || normKey.includes(norm)) return DISEASE_DB[key];
    }
    return null; // 매칭 실패
  }

  // ─────────────────────────────────────────────────────
  // 각 클래스별 스타일 + 병해 상세 정보 데이터베이스
  //
  // 📝 수정 방법:
  //   - className: Teachable Machine에서 설정한 클래스 이름과 '정확히' 일치해야 합니다
  //   - isDisease: true면 병해, false면 정상(건강)으로 처리됩니다
  //   - severity: "high"(위험) / "medium"(주의) / "low"(정상)

        { type:"normal",  text:"🌡️ 재배사 온도를 낮추고(18°C 이하) 환기를 강화해 습도를 80% 이하로 유지하세요." },

      ]
    },

    "세균성갈반병": {

      isDisease: true,

        { type:"urgent",  text:"💨 환기를 즉시 강화하여 버섯 표면의 수분을 빠르게 제거하세요." },
        { type:"normal",  text:"💧 관수량과 횟수를 줄이고, 저녁보다 오전 관수를 권장합니다." },

    },

    "바이러스병": {
      icon: "🔴",
      color: "#f87171",

      cause:

      symptoms:
        "버섯이 기형·왜소화되고 갓이 뒤틀립니다. 색이 비정상적으로 창백해지거나 " +
        "균사 생장이 현저히 느려집니다. 전체 수확량이 30–70% 감소할 수 있습니다.",
      actions: [

        { type:"urgent",  text:"🔒 감염 재배사는 폐쇄하고, 건강한 재배사와의 교차 출입을 금지하세요." },
        { type:"normal",  text:"🧼 모든 도구(칼, 집게 등)를 70% 알코올로 소독 후 사용하세요." },
        { type:"normal",  text:"🌱 바이러스 무병 인증 종균만 사용하고, 출처가 불명확한 종균은 쓰지 마세요." },
        { type:"prevent", text:"👟 재배사 입구에 소독 매트를 설치하고 외부인 출입을 제한하세요." },
        { type:"prevent", text:"📋 매 사이클마다 종균 업체에서 건강 검진 성적서를 발급받아 확인하세요." }
      ]
    }

    // ✏️ 클래스가 더 있다면 위 형식대로 추가하세요!
    // 예시:
    // "내가만든클래스명": {
    //   icon: "🟡", color: "#fbbf24", isDisease: true, severity: "medium",
    //   cause: "원인 설명...", symptoms: "증상 설명...",
    //   actions: [
    //     { type:"urgent",  text:"즉시 해야 할 일..." },
    //     { type:"normal",  text:"일반 처리 방법..." },
    //     { type:"prevent", text:"예방 방법..." }

  // ════════════════════════════════════════════════════
  // 🗂️ 전역 변수
  // ════════════════════════════════════════════════════
  let model = null;
  let isModelLoaded = false;

  // ════════════════════════════════════════════════════
  // 🚀 페이지 로드 시 AI 모델 미리 불러오기
  // ════════════════════════════════════════════════════
  window.addEventListener("load", async () => {
    try {
      model = await tmImage.load(
        MODEL_URL + "model.json",
        MODEL_URL + "metadata.json"
      );
      isModelLoaded = true;
      document.getElementById("classCount").textContent =
        model.getTotalClasses() + "개 클래스";
      document.getElementById("modelStatus").textContent = "✓ 준비 완료";
    } catch (err) {
      console.error("모델 로드 실패:", err);
      document.getElementById("modelStatus").textContent = "❌ 로드 실패";
      document.getElementById("modelStatus").style.color = "#f87171";
    }
  });

  // ════════════════════════════════════════════════════
  // ① 드래그&드롭 이벤트 핸들러
  // ════════════════════════════════════════════════════

  /**
   * 파일을 영역 위로 끌어왔을 때 실행
   * event.preventDefault() → 브라우저가 파일을 직접 열지 않도록 막습니다
   */
  function handleDragOver(event) {
    event.preventDefault();          // 브라우저 기본 동작(파일 열기) 차단
    event.stopPropagation();         // 이벤트가 부모 요소로 전달되지 않게 차단
    // 'drag-over' 클래스를 추가해 CSS에서 지정한 강조 스타일을 적용합니다
    document.getElementById("uploadZone").classList.add("drag-over");
    // 마우스 커서를 '복사' 모양으로 변경
    event.dataTransfer.dropEffect = "copy";
  }

  /**
   * 파일을 영역 밖으로 벗어났을 때 실행 – 강조 스타일 제거
   */
  function handleDragLeave(event) {
    event.preventDefault();
    // relatedTarget: 마우스가 이동한 다음 요소
    // uploadZone 안의 자식 요소로 이동했을 때는 drag-over를 유지해야 합니다
    const zone = document.getElementById("uploadZone");
    if (!zone.contains(event.relatedTarget)) {
      zone.classList.remove("drag-over");
    }
  }

  /**
   * 파일을 영역에 떨어뜨렸을 때 실행 – 파일을 받아서 미리보기 처리
   */
  function handleDrop(event) {
    event.preventDefault();
    event.stopPropagation();
    document.getElementById("uploadZone").classList.remove("drag-over");

    // event.dataTransfer.files → 드래그해서 놓은 파일 목록
    const files = event.dataTransfer.files;
    if (!files || files.length === 0) return;

    const file = files[0]; // 첫 번째 파일만 사용

    // 이미지 파일인지 확인합니다 (file.type: "image/jpeg", "image/png" 등)
    if (!file.type.startsWith("image/")) {
      alert("이미지 파일만 업로드할 수 있습니다.\n(jpg, png, gif, webp 등)");
      return;
    }

    // 파일을 미리보기로 표시하는 공통 함수 호출
    loadImagePreview(file);
  }

  // ════════════════════════════════════════════════════
  // 📷 카메라 / 갤러리 버튼
  // ════════════════════════════════════════════════════

  function openCamera() {
    const input = document.getElementById("fileInput");
    input.setAttribute("capture", "environment"); // 후면 카메라 지정
    input.click();
  }

  function openGallery() {
    const input = document.getElementById("fileInput");
    input.removeAttribute("capture");              // 갤러리만 열기
    input.click();
  }

  /** 파일 input에서 파일 선택 시 실행 */
  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    loadImagePreview(file);
  }

  // ════════════════════════════════════════════════════
  // 🖼️ 이미지 미리보기 공통 함수
  // (드래그&드롭 / 파일선택 양쪽에서 호출)
  // ════════════════════════════════════════════════════

  /**
   * File 객체를 받아 미리보기 이미지로 표시하고
   * 분석 버튼을 화면에 나타냅니다
   * @param {File} file - 표시할 이미지 파일
   */
  function loadImagePreview(file) {
    const reader = new FileReader();

    // 파일 읽기 완료 시 실행
    reader.onload = (e) => {
      document.getElementById("previewImg").src = e.target.result;
      document.getElementById("previewWrap").style.display = "block";
      document.getElementById("analyzeBtn").style.display  = "flex";
      document.getElementById("resultSection").style.display = "none";
      document.getElementById("diseaseInfoSection").innerHTML = "";
    };

    reader.readAsDataURL(file); // 파일을 Base64 문자열로 읽기
  }

  // ════════════════════════════════════════════════════
  // 🔬 AI 분석 실행
  // ════════════════════════════════════════════════════

  async function runAnalysis() {
    if (!isModelLoaded) {
      alert("AI 모델을 로드 중입니다. 잠시 후 다시 시도해 주세요.");
      return;
    }

    document.getElementById("analyzeBtn").style.display = "none";
    showLoading(true);

    try {
      const imgElement = document.getElementById("previewImg");
      const predictions = await model.predict(imgElement); // AI 분석 실행
      showLoading(false);
      displayResults(predictions);
    } catch (err) {
      console.error("분석 오류:", err);
      showLoading(false);
      alert("분석 중 오류가 발생했습니다: " + err.message);
      document.getElementById("analyzeBtn").style.display = "flex";
    }
  }

  // ════════════════════════════════════════════════════
  // 📊 결과 화면 표시
  // ════════════════════════════════════════════════════

  function displayResults(predictions) {

    // 확률 내림차순 정렬
    const sorted = [...predictions].sort((a, b) => b.probability - a.probability);
    const top    = sorted[0];
    const topPct = Math.round(top.probability * 100);

    // findInDB: 정규화 후 DB에서 찾기 (직접 키 접근 대신 사용)
    const topData = findInDB(top.className) || { icon:"🍄", color:"#4ade80" };

    // ── 1등 결과 강조 박스 ──
    document.getElementById("topResultIcon").textContent = topData.icon;
    document.getElementById("topResultName").textContent = top.className;
    document.getElementById("topResultConf").textContent = topPct + "%";
    document.getElementById("topResultConf").style.color  = topData.color;

    // ── 게이지 바 생성 ──
    const barsContainer = document.getElementById("resultBars");
    barsContainer.innerHTML = "";

    sorted.forEach((pred, index) => {
      const pct   = Math.round(pred.probability * 100);
      const style = findInDB(pred.className) || {
        icon: "🔘",
        color: index === 0 ? "#4ade80" : "#475569"
      };

      barsContainer.insertAdjacentHTML("beforeend", `
        <div class="result-item">
          <div class="result-header">
            <span class="result-name">
              <span class="result-dot" style="background:${style.color}"></span>
              ${style.icon} ${pred.className}
            </span>
            <span class="result-pct"
                  style="color:${index === 0 ? style.color : '#64748b'}">
              ${pct}%
            </span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-${index}"
                 style="width:0%; background:${
                   index === 0
                     ? `linear-gradient(90deg,${style.color}88,${style.color})`
                     : 'linear-gradient(90deg,#1e3a5f,#2d4a6f)'
                 }">
            </div>
          </div>
        </div>
      `);

      setTimeout(() => {
        const bar = document.getElementById(`bar-${index}`);
        if (bar) bar.style.width = pct + "%";
      }, 100 + index * 80);
    });

    // ── ② 병해 정보 카드 생성 ──
    renderDiseaseInfo(top.className, topPct);

    // ── 🛠 디버그 패널: 모델이 반환한 실제 클래스 이름 표시 ──
    // 병해 카드가 여전히 안 나온다면 아래 박스의 이름을 DISEASE_DB 키와 비교하세요
    renderDebugPanel(sorted);

    // 결과 영역 표시
    document.getElementById("resultSection").style.display = "block";
    document.getElementById("resultSection")
            .scrollIntoView({ behavior:"smooth", block:"start" });
  }

  // ════════════════════════════════════════════════════
  // 🛠 디버그 패널 – 모델 실제 클래스명 확인용
  //    병해 카드가 나오면 이 패널은 자동으로 숨겨집니다
  // ════════════════════════════════════════════════════
  function renderDebugPanel(sorted) {
    const container = document.getElementById("debugPanel");
    if (!container) return;

    // findInDB가 성공했는지 확인
    const topMatched = findInDB(sorted[0].className) !== null;

    // 매칭 성공 시 디버그 패널 숨기기
    if (topMatched) {
      container.style.display = "none";
      return;
    }

    // 매칭 실패 시 실제 클래스 이름을 표시
    const rows = sorted.map(p => {
      const matched = findInDB(p.className) ? "✅ DB 매칭됨" : "❌ DB에 없음";
      // JSON.stringify로 눈에 안 보이는 특수문자까지 드러냄
      const escaped = JSON.stringify(p.className);
      return `<tr>
        <td style="padding:6px 10px;color:#e2e8f0;font-size:13px;">${p.className}</td>
        <td style="padding:6px 10px;color:#94a3b8;font-size:11px;font-family:monospace;">${escaped}</td>
        <td style="padding:6px 10px;font-size:12px;">${matched}</td>
      </tr>`;
    }).join("");

    container.style.display = "block";
    container.innerHTML = `
      <div style="background:#1a1a2e;border:1px solid #f87171;border-radius:14px;padding:18px;margin-bottom:16px;">
        <div style="font-size:12px;font-weight:700;color:#f87171;letter-spacing:1px;margin-bottom:12px;">
          🛠 디버그: 병해 정보 카드가 안 나오는 이유
        </div>
        <div style="font-size:12px;color:#94a3b8;line-height:1.7;margin-bottom:12px;">
          아래 <strong style="color:#fbbf24">모델 실제 클래스명</strong>을 복사해서<br>
          HTML 파일의 <code style="color:#60a5fa;background:#0a1628;padding:2px 6px;border-radius:4px;">DISEASE_DB</code> 키 이름과 정확히 일치하도록 수정하세요.
        </div>
        <table style="width:100%;border-collapse:collapse;background:#0a1628;border-radius:10px;overflow:hidden;">
          <thead>
            <tr style="background:#162040;">
              <th style="padding:8px 10px;text-align:left;font-size:11px;color:#94a3b8;">모델 클래스명</th>
              <th style="padding:8px 10px;text-align:left;font-size:11px;color:#94a3b8;">내부 코드값</th>
              <th style="padding:8px 10px;text-align:left;font-size:11px;color:#94a3b8;">DB 매칭</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  // ════════════════════════════════════════════════════
  // ② 병해 정보 카드 렌더링 함수 (핵심 추가 기능)
  // ════════════════════════════════════════════════════

  /**
   * 진단된 클래스 이름을 받아 DISEASE_DB에서 정보를 꺼내
   * 원인 / 증상 / 처리방법 카드를 동적으로 생성합니다
   *
   * @param {string} className - AI가 예측한 클래스 이름
   * @param {number} pct       - 신뢰도 퍼센트
   */
  function renderDiseaseInfo(className, pct) {
    const container = document.getElementById("diseaseInfoSection");
    // DISEASE_DB 직접 접근 대신 정규화 매칭 함수 사용
    const data = findInDB(className);

    // DISEASE_DB에 해당 클래스 정보가 없으면 아무것도 표시하지 않음
    if (!data) {
      container.innerHTML = "";
      return;
    }

    // ── 정상(건강) 판정일 때 ──────────────────────
    if (!data.isDisease) {
      container.innerHTML = `
        <div class="healthy-banner">
          <div class="big-icon">🎉</div>
          <h3>건강한 버섯입니다!</h3>
          <p>
            AI 분석 결과 병해 징후가 감지되지 않았습니다.<br>
            현재 재배 환경을 유지하며 계속 관리해 주세요.<br>
            <strong style="color:var(--accent-green)">신뢰도: ${pct}%</strong>
          </p>
        </div>
      `;
      return;
    }

    // ── 병해 판정일 때 ────────────────────────────

    // 위험도에 따라 배지 클래스와 텍스트를 결정
    const severityMap = {
      high:   { cls:"severity-high",   label:"🔴 위험 – 즉시 처리 필요" },
      medium: { cls:"severity-medium", label:"🟡 주의 – 빠른 조치 권장" },
      low:    { cls:"severity-low",    label:"🟢 경미 – 관찰 지속" }
    };
    const sev = severityMap[data.severity] || severityMap["medium"];

    // 처리방법 HTML – 타입에 따라 색상이 달라집니다
    const actionsHTML = data.actions.map((act, i) => `
      <div class="action-item ${act.type}">
        <span class="action-num">${i + 1}</span>
        <span class="action-text">${act.text}</span>
      </div>
    `).join("");

    // 카드 헤더 배경색 – 위험도에 맞게 은은하게 적용
    const headerBgMap = {
      high:   "rgba(248,113,113,0.08)",
      medium: "rgba(251,191,36,0.08)",
      low:    "rgba(74,222,128,0.08)"
    };
    const headerBg = headerBgMap[data.severity] || headerBgMap["medium"];

    container.innerHTML = `
      <div class="card disease-card">
        <div class="card-title"><span>🔬</span> 병해 정보 및 처리 가이드</div>

        <!-- 병명 + 위험도 헤더 -->
        <div class="disease-header"
             style="background:${headerBg}; border-radius:12px; margin-bottom:16px;">
          <span class="disease-header-icon">${data.icon}</span>
          <div class="disease-header-text">
            <div class="disease-name">${className}</div>
            <span class="severity-badge ${sev.cls}">${sev.label}</span>
          </div>
        </div>

        <!-- 발생 원인 -->
        <div class="disease-body">
          <div class="info-section">
            <div class="info-section-title"
                 style="color:var(--accent-yellow)">
              ⚗️ <span>발생 원인</span>
            </div>
            <div class="info-section-content">${data.cause}</div>
          </div>

          <div class="disease-divider"></div>

          <!-- 주요 증상 -->
          <div class="info-section">
            <div class="info-section-title"
                 style="color:var(--accent-orange)">
              🔍 <span>주요 증상</span>
            </div>
            <div class="info-section-content">${data.symptoms}</div>
          </div>

          <div class="disease-divider"></div>

          <!-- 처리방법 -->
          <div class="info-section">
            <div class="info-section-title"
                 style="color:var(--accent-red)">
              🛠️ <span>처리 방법</span>
            </div>
            <div class="action-list">
              ${actionsHTML}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // ════════════════════════════════════════════════════
  // 🔄 보조 함수들
  // ════════════════════════════════════════════════════

  function showLoading(show) {
    document.getElementById("loadingSection").style.display = show ? "block" : "none";
    document.getElementById("loadingWrap").style.display    = show ? "flex"  : "none";
  }

  function resetAll() {
    document.getElementById("previewImg").src              = "";
    document.getElementById("previewWrap").style.display   = "none";
    document.getElementById("analyzeBtn").style.display    = "none";
    document.getElementById("resultSection").style.display = "none";
    document.getElementById("diseaseInfoSection").innerHTML = "";
    document.getElementById("debugPanel").style.display    = "none";
    document.getElementById("debugPanel").innerHTML        = "";
    document.getElementById("fileInput").value             = "";
    showLoading(false);
    window.scrollTo({ top:0, behavior:"smooth" });
  }

</script>
</body>
</html>
